<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0C1B17">
<title>滑动拼图 · 还原照片</title>
<style>
:root{
  --amber:#F5A94B;
  --cream:#F2EFE6;
  --mist:#9DB3AB;
  --serif:'Noto Serif SC','Songti SC','STSong','STZhongsong','SimSun',serif;
  --sans:'PingFang SC','Microsoft YaHei','Helvetica Neue',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--cream);
  background:
    radial-gradient(120% 90% at 50% -10%, #1B3A2F 0%, transparent 55%),
    radial-gradient(90% 70% at 85% 110%, #14302A 0%, transparent 60%),
    #0C1B17;
  min-height:100dvh;display:flex;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
.stage{width:100%;max-width:430px;padding:max(22px,env(safe-area-inset-top)) 20px 26px;display:flex;flex-direction:column;align-items:center}
.head{text-align:center;margin:6px 0 20px}
.title{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:.06em;color:var(--cream)}
.dash{width:36px;height:3px;border-radius:2px;background:var(--amber);margin:12px auto 0}
.sub{font-size:13px;color:var(--mist);margin-top:10px}
.boardWrap{position:relative;line-height:0}
.boardWrap::after{content:'';position:absolute;inset:-16px;border-radius:28px;z-index:-1;
  background:radial-gradient(60% 60% at 50% 55%, rgba(245,169,75,.15), transparent 72%)}
.board{position:relative;border-radius:16px;overflow:hidden;background:#0A1613;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.72), 0 0 0 1px rgba(242,239,230,.09)}
.tile{position:absolute;left:0;top:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-drag:none;
  box-shadow:inset 0 0 0 1px rgba(242,239,230,.10);
  transition:left .16s ease, top .16s ease}
.tile:focus-visible{outline:2px solid var(--cream);outline-offset:-2px;z-index:5}
.tile.pop{cursor:default;animation:popA .55s cubic-bezier(.2,.9,.3,1.15)}
@keyframes popA{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.no-anim .tile{transition:none!important}
.ctrl{width:100%;display:flex;flex-direction:column;align-items:center;margin-top:20px}
.status{font-size:13px;color:var(--mist);text-align:center;min-height:19px}
.hint{font-size:12px;color:var(--amber);text-align:center;min-height:17px;margin-top:2px}
.shuffleBtn{margin-top:10px;padding:8px 24px;border-radius:999px;border:1px solid rgba(242,239,230,.28);
  background:transparent;color:var(--mist);font-size:13px;letter-spacing:.08em;cursor:pointer;
  transition:color .2s,border-color .2s}
.shuffleBtn:hover:not(:disabled),.shuffleBtn:focus-visible{color:var(--cream);border-color:var(--amber);outline:none}
.shuffleBtn:disabled{opacity:.35;cursor:not-allowed}
.foot{margin-top:auto;padding-top:24px;font-size:11px;letter-spacing:.24em;color:rgba(157,179,171,.62)}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(6,13,11,.87);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transition:opacity .25s ease;padding:22px}
.overlay.show{display:flex}
.overlay.in{opacity:1}
.reveal{max-width:360px;width:100%;text-align:center;position:relative;z-index:2;
  transform:translateY(26px);transition:transform .45s cubic-bezier(.2,.9,.25,1.1)}
.overlay.in .reveal{transform:none}
.photo{position:relative;background:#F7F4EC;padding:10px 10px 14px;border-radius:6px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.8);transform:rotate(-1.2deg)}
.photo img{width:100%;display:block;border-radius:3px}
.reveal-title{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--amber);
  margin-top:22px;letter-spacing:.08em;text-shadow:0 2px 24px rgba(245,169,75,.35)}
.reveal-sub{color:var(--mist);font-size:14px;margin-top:8px}
.again{margin-top:20px;padding:12px 34px;border-radius:999px;border:1.5px solid var(--amber);
  background:transparent;color:var(--amber);font-size:15px;letter-spacing:.1em;cursor:pointer;transition:background .2s}
.again:hover,.again:focus-visible{background:rgba(245,169,75,.16);outline:none}
.save-hint{margin-top:14px;font-size:11px;color:rgba(157,179,171,.7)}
#confetti{position:fixed;inset:0;z-index:1;pointer-events:none}
@keyframes flashA{0%{filter:brightness(1)}25%{filter:brightness(1.55) saturate(1.15)}100%{filter:brightness(1)}}
.flash{animation:flashA .55s ease-out}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<main class="stage">
  <header class="head">
    <h1 class="title">请还原这张图片</h1>
    <div class="dash"></div>
    <p class="sub">点击方块滑动，把照片复原</p>
  </header>
  <section class="boardWrap" id="puzzleWrap">
    <div class="board" id="board"></div>
  </section>
  <section class="ctrl">
    <p class="status" id="status">已滑动 0 次</p>
    <p class="hint" id="hint"></p>
    <button class="shuffleBtn" id="shuffleBtn" type="button">重新打乱</button>
  </section>
  <footer class="foot">复原照片 · 解锁线索</footer>
</main>
<div class="overlay" id="overlay">
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="reveal">
    <div class="photo">
      <img id="revealImg" alt="要寻找的地方">
    </div>
    <h2 class="reveal-title">找到这个地方</h2>
    <p class="reveal-sub">记住照片里的位置，出发寻找吧</p>
    <button class="again" id="againBtn" type="button">再玩一次</button>
    <p class="save-hint">长按图片可保存到手机</p>
  </div>
</div>

function $(s){return document.querySelector(s);}
var board=$('#board');
var statusEl=$('#status'), hintEl=$('#hint'), shufBtn=$('#shuffleBtn');
var overlay=$('#overlay'), revealImg=$('#revealImg'), confC=$('#confetti');
var img=null, W=0, H=0, tw=0, th=0;
var grid=[], blank=8, moves=0, locked=false, hintShown=false, shuffleLog=[];
var tiles=[], finalTile=null, lastLW=0, lastLH=0;

function loadImage(src){
  return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=rej;i.src=src;});
}
function colX(c){return Math.round(c*tw);}
function rowY(r){return Math.round(r*th);}
function cellPos(cell){return {x:colX(cell%3),y:rowY((cell/3)|0)};}
function tileSize(home){
  var c=home%3,r=(home/3)|0;
  return {w:colX(c+1)-colX(c),h:rowY(r+1)-rowY(r)};
}
function layout(){
  var availW=Math.min(document.querySelector('.stage').clientWidth-40,400);
  var ratio=img.width/img.height;
  var maxH=Math.min(window.innerHeight*0.55,560);
  var h=maxH,w=h*ratio;
  if(w>availW){w=availW;h=w/ratio;}
  W=Math.round(w);H=Math.round(h);
  tw=W/3;th=H/3;
  board.style.width=W+'px';board.style.height=H+'px';
}
function styleTile(id){
  var c=id%3,r=(home2(id)),ts=tileSize(id),t=tiles[id];
  t.style.width=ts.w+'px';t.style.height=ts.h+'px';
  t.style.backgroundSize=W+'px '+H+'px';
  t.style.backgroundPosition=(-colX(c))+'px '+(-rowY(r))+'px';
}
function home2(id){return (id/3)|0;}
function makeTile(id){
  var t=document.createElement('div');
  t.className='tile';t.tabIndex=0;t.setAttribute('role','button');
  t.setAttribute('aria-label','拼图方块 '+(id+1));
  t.style.backgroundImage="url('"+IMG_PUZZLE+"')";
  t.addEventListener('click',function(){tryMove(grid.indexOf(id));});
  t.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();tryMove(grid.indexOf(id));}
  });
  board.appendChild(t);
  return t;
}
function buildTiles(){
  board.innerHTML='';
  tiles=[];
  for(var id=0;id<8;id++){
    var t=makeTile(id);
    tiles.push(t);
    styleTile(id);
  }
  finalTile=null;
}
function posTile(id,cell){
  var p=cellPos(cell),t=tiles[id];
  if(t){t.style.left=p.x+'px';t.style.top=p.y+'px';}
}
function render(){for(var id=0;id<8;id++){posTile(id,grid.indexOf(id));}}
function isSolved(){for(var i=0;i<8;i++){if(grid[i]!==i)return false;}return true;}
function tryMove(cell){
  if(locked||cell===blank||cell<0||cell>8)return false;
  if(grid[cell]===-1)return false;
  var r=(cell/3)|0,q=cell%3,br=(blank/3)|0,bq=blank%3;
  if(r!==br&&q!==bq)return false;
  var step;
  if(r===br){step=q<bq?1:-1;}else{step=r<br?3:-3;}
  var cur=blank;
  while(cur!==cell){
    var prev=cur-step;
    grid[cur]=grid[prev];
    posTile(grid[cur],cur);
    cur=prev;
  }
  grid[cell]=-1;blank=cell;moves++;
  statusEl.textContent='已滑动 '+moves+' 次';
  if(moves>=12&&!hintShown){hintShown=true;hintEl.textContent='小提示：点与空位同行/同列的方块可整排滑动';}
  checkWin();
  return true;
}
function makeFinalTile(){
  var t=document.createElement('div');
  t.className='tile pop';
  var c=8%3,r=2,ts=tileSize(8);
  t.style.width=ts.w+'px';t.style.height=ts.h+'px';
  t.style.left=colX(c)+'px';t.style.top=rowY(r)+'px';
  t.style.backgroundImage="url('"+IMG_PUZZLE+"')";
  t.style.backgroundSize=W+'px '+H+'px';
  t.style.backgroundPosition=(-colX(c))+'px '+(-rowY(r))+'px';
  board.appendChild(t);
  finalTile=t;
}
function checkWin(){
  if(!isSolved())return;
  locked=true;shufBtn.disabled=true;
  statusEl.textContent='完成！';hintEl.textContent='';
  makeFinalTile();
  board.classList.add('flash');
  setTimeout(showOverlay,700);
}
function shuffle(){
  board.classList.add('no-anim');
  if(finalTile){finalTile.remove();finalTile=null;}
  grid=[0,1,2,3,4,5,6,7,-1];blank=8;moves=0;hintShown=false;locked=false;
  shufBtn.disabled=false;
  shuffleLog=[];
  var last=-1;
  for(var m=0;m<140;m++){
    var br=(blank/3)|0,bq=blank%3,opts=[];
    if(br>0)opts.push(blank-3);
    if(br<2)opts.push(blank+3);
    if(bq>0)opts.push(blank-1);
    if(bq<2)opts.push(blank+1);
    var pick=opts[(Math.random()*opts.length)|0];
    if(pick===last&&opts.length>1){pick=opts[(opts.indexOf(pick)+1)%opts.length];}
    last=blank;
    grid[blank]=grid[pick];grid[pick]=-1;blank=pick;
    shuffleLog.push(last);
  }
  if(isSolved()){shuffle();return;}
  render();
  statusEl.textContent='已滑动 0 次';
  hintEl.textContent='';
  setTimeout(function(){board.classList.remove('no-anim');},80);
}
function showOverlay(){
  revealImg.src=IMG_REVEAL||IMG_PUZZLE;
  overlay.classList.add('show');
  requestAnimationFrame(function(){overlay.classList.add('in');});
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){confetti();}
}
function restart(){
  overlay.classList.remove('in');
  setTimeout(function(){overlay.classList.remove('show');shuffle();},220);
}
function confetti(){
  var c=confC,cx=c.getContext('2d');
  c.width=window.innerWidth;c.height=window.innerHeight;
  var colors=['#F5A94B','#F2EFE6','#7BC4A2','#E8654F','#FFFFFF'];
  var parts=[],i;
  for(i=0;i<130;i++){
    parts.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.4,
      w:6+Math.random()*6,h:8+Math.random()*8,
      vy:2.2+Math.random()*3,vx:-1.5+Math.random()*3,
      rot:Math.random()*Math.PI,vr:-0.15+Math.random()*0.3,
      col:colors[(Math.random()*colors.length)|0]});
  }
  var t0=performance.now();
  function loop(t){
    cx.clearRect(0,0,c.width,c.height);
    for(var j=0;j<parts.length;j++){
      var p=parts[j];p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
      cx.fillStyle=p.col;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      cx.restore();
    }
    if(t-t0<2800&&overlay.classList.contains('in')){requestAnimationFrame(loop);}
    else{cx.clearRect(0,0,c.width,c.height);}
  }
  requestAnimationFrame(loop);
}
shufBtn.addEventListener('click',function(){if(!locked){shuffle();}});
$('#againBtn').addEventListener('click',restart);
var resizeTimer=null;
window.addEventListener('resize',function(){
  if(!img)return;
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(function(){
    var nw=window.innerWidth,nh=window.innerHeight;
    if(nw===lastLW&&Math.abs(nh-lastLH)<130)return;
    lastLW=nw;lastLH=nh;
    layout();
    for(var id=0;id<8;id++){styleTile(id);}
    render();
  },180);
});
loadImage(IMG_PUZZLE).then(function(i){
  img=i;lastLW=window.innerWidth;lastLH=window.innerHeight;
  layout();buildTiles();shuffle();
}).catch(function(){statusEl.textContent='图片加载失败，请刷新重试';});
window.__puzzle={
  tryMove:tryMove,
  info:function(){return {grid:grid.slice(),blank:blank,moves:moves,log:shuffleLog.slice(),solved:isSolved()};}
};
})();
</script>
</body>
