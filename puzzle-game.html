<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0C1B17">
<title>滑块拼图 · 寻宝任务</title>
<style>
:root{
  --amber:#F5A94B;
  --cream:#F2EFE6;
  --mist:#9DB3AB;
  --serif:'Noto Serif SC','Songti SC','STSong','STZhongsong','SimSun',serif;
  --sans:'PingFang SC','Microsoft YaHei','Helvetica Neue',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--cream);
  background:
    radial-gradient(120% 90% at 50% -10%, #1B3A2F 0%, transparent 55%),
    radial-gradient(90% 70% at 85% 110%, #14302A 0%, transparent 60%),
    #0C1B17;
  min-height:100dvh;display:flex;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
.stage{width:100%;max-width:430px;padding:max(22px,env(safe-area-inset-top)) 20px 26px;display:flex;flex-direction:column;align-items:center}
.head{text-align:center;margin:6px 0 20px}
.eyebrow{font-size:11px;letter-spacing:.42em;text-indent:.42em;color:var(--amber)}
.title{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:.06em;margin-top:10px;color:var(--cream)}
.sub{font-size:13px;color:var(--mist);margin-top:8px}
.board{position:relative;display:block;line-height:0;border-radius:16px;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.72), 0 0 0 1px rgba(242,239,230,.09)}
.board::after{content:'';position:absolute;inset:-16px;border-radius:28px;z-index:-1;
  background:radial-gradient(60% 60% at 50% 55%, rgba(245,169,75,.15), transparent 72%)}
.board canvas{display:block;border-radius:16px}
#pc{position:absolute;left:0;top:0;filter:drop-shadow(0 5px 9px rgba(0,0,0,.45));cursor:grab}
.ctrl{width:100%;display:flex;flex-direction:column;align-items:center;margin-top:20px}
.track{position:relative;height:52px;border-radius:26px;background:rgba(242,239,230,.08);
  box-shadow:inset 0 1px 4px rgba(0,0,0,.45), 0 0 0 1px rgba(242,239,230,.07);overflow:hidden}
.fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:26px;
  background:linear-gradient(90deg, rgba(245,169,75,.12), rgba(245,169,75,.38))}
.handle{position:absolute;left:0;top:0;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(160deg,#FFC46B,#F09A32);color:#3A2506;font-weight:800;font-size:22px;
  display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;
  box-shadow:0 6px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.5)}
.handle:active{cursor:grabbing}
.handle:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.status{margin-top:12px;font-size:13px;color:var(--mist);text-align:center;min-height:19px}
.hint{font-size:12px;color:var(--amber);text-align:center;min-height:17px;margin-top:2px}
.foot{margin-top:auto;padding-top:24px;font-size:11px;letter-spacing:.24em;color:rgba(157,179,171,.62)}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(6,13,11,.87);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transition:opacity .25s ease;padding:22px}
.overlay.show{display:flex}
.overlay.in{opacity:1}
.reveal{max-width:360px;width:100%;text-align:center;position:relative;z-index:2;
  transform:translateY(26px);transition:transform .45s cubic-bezier(.2,.9,.25,1.1)}
.overlay.in .reveal{transform:none}
.photo{position:relative;background:#F7F4EC;padding:10px 10px 14px;border-radius:6px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.8);transform:rotate(-1.2deg)}
.photo img{width:100%;display:block;border-radius:3px}
.stamp{position:absolute;top:10px;right:10px;width:78px;height:78px;border:2.5px solid rgba(200,64,47,.9);
  border-radius:50%;color:rgba(200,64,47,.92);font-family:var(--serif);font-weight:700;font-size:19px;
  display:grid;place-items:center;transform:rotate(12deg);letter-spacing:.1em;text-indent:.1em;
  box-shadow:inset 0 0 0 2px rgba(200,64,47,.32);background:rgba(247,244,236,.14)}
.reveal-title{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--amber);
  margin-top:22px;letter-spacing:.08em;text-shadow:0 2px 24px rgba(245,169,75,.35)}
.reveal-sub{color:var(--mist);font-size:14px;margin-top:8px}
.again{margin-top:20px;padding:12px 34px;border-radius:999px;border:1.5px solid var(--amber);
  background:transparent;color:var(--amber);font-size:15px;letter-spacing:.1em;cursor:pointer;transition:background .2s}
.again:hover,.again:focus-visible{background:rgba(245,169,75,.16);outline:none}
.save-hint{margin-top:14px;font-size:11px;color:rgba(157,179,171,.7)}
#confetti{position:fixed;inset:0;z-index:1;pointer-events:none}
@keyframes flashA{0%{filter:brightness(1)}25%{filter:brightness(1.55) saturate(1.15)}100%{filter:brightness(1)}}
.flash{animation:flashA .55s ease-out}
@keyframes shakeA{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}55%{transform:translateX(7px)}80%{transform:translateX(-4px)}}
.shake{animation:shakeA .38s ease}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<main class="stage">
  <header class="head">
    <div class="eyebrow">扫码寻宝任务</div>
    <h1 class="title">拼出这个地方</h1>
    <p class="sub">拖动滑块，把拼图块移进缺口</p>
  </header>
  <section class="board" id="puzzleWrap">
    <canvas id="bg"></canvas>
    <canvas id="pc" aria-hidden="true"></canvas>
  </section>
  <section class="ctrl">
    <div class="track" id="track">
      <div class="fill" id="fill"></div>
      <div class="handle" id="handle" tabindex="0" role="slider" aria-label="拖动滑块完成拼图" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">&raquo;</div>
    </div>
    <p class="status" id="status"></p>
    <p class="hint" id="hint"></p>
  </section>
  <footer class="foot">完成拼图 · 解锁地点线索</footer>
</main>
<div class="overlay" id="overlay">
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="reveal">
    <div class="photo">
      <img id="revealImg" alt="要寻找的地方">
      <span class="stamp">已找到</span>
    </div>
    <h2 class="reveal-title">找到这个地方</h2>
    <p class="reveal-sub">记住照片里的位置，出发寻找吧</p>
    <button class="again" id="againBtn" type="button">再玩一次</button>
    <p class="save-hint">长按图片可保存到手机</p>
  </div>
</div>

function $(s){return document.querySelector(s);}
var bgC=$('#bg'), pcC=$('#pc'), wrap=$('#puzzleWrap');
var track=$('#track'), handle=$('#handle'), fill=$('#fill');
var statusEl=$('#status'), hintEl=$('#hint');
var overlay=$('#overlay'), revealImg=$('#revealImg'), confC=$('#confetti');
var bctx=bgC.getContext('2d'), pctx=pcC.getContext('2d');

var lastLW=0, lastLH=0;

function loadImage(src){
  return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=rej;i.src=src;});
}
function P(v){return v*k;}
function layout(){
  var availW=Math.min(document.querySelector('.stage').clientWidth-40, 400);
  var ratio=img.width/img.height;
  var maxH=Math.min(window.innerHeight*0.52, 560);
  var h=maxH, w=h*ratio;
  if(w>availW){w=availW;h=w/ratio;}
  W=Math.round(w);H=Math.round(h);
  k=Math.min(window.devicePixelRatio||1,3);
  bgC.width=Math.round(W*k);bgC.height=Math.round(H*k);
  bgC.style.width=W+'px';bgC.style.height=H+'px';
  s=Math.round(Math.max(46,W*0.17));
  r=Math.round(s*0.27);
  pad=r+6;
  pcC.width=Math.round((s+2*pad)*k);pcC.height=pcC.width;
  pcC.style.width=(s+2*pad)+'px';pcC.style.height=(s+2*pad)+'px';
  track.style.width=W+'px';
  off=document.createElement('canvas');
  off.width=bgC.width;off.height=bgC.height;
  var octx=off.getContext('2d');
  var sc=Math.max(bgC.width/img.width,bgC.height/img.height);
  var dw=img.width*sc, dh=img.height*sc;
  octx.drawImage(img,(bgC.width-dw)/2,(bgC.height-dh)/2,dw,dh);
}
function randomHole(){
  var minX=Math.round(W*0.55), maxX=Math.round(W-s-r-6);
  var minY=Math.round(r+8), maxY=Math.round(H-s-r-8);
  if(maxX<minX){maxX=minX;}
  if(maxY<minY){maxY=minY;}
  tx=Math.round(minX+Math.random()*(maxX-minX));
  ty=Math.round(minY+Math.random()*(maxY-minY));
  pcC.style.top=(ty-pad)+'px';
}
function piecePath(ctx,x0,y0,sz,rr){
  var cx=x0+sz/2, cy=y0+sz/2;
  ctx.beginPath();
  ctx.moveTo(x0,y0);
  ctx.lineTo(cx-rr,y0);
  ctx.bezierCurveTo(cx-rr,y0-rr*1.3,cx+rr,y0-rr*1.3,cx+rr,y0);
  ctx.lineTo(x0+sz,y0);
  ctx.lineTo(x0+sz,cy-rr);
  ctx.bezierCurveTo(x0+sz+rr*1.3,cy-rr,x0+sz+rr*1.3,cy+rr,x0+sz,cy+rr);
  ctx.lineTo(x0+sz,y0+sz);
  ctx.lineTo(x0,y0+sz);
  ctx.closePath();

function drawBG(){

  bctx.save();

  bctx.shadowColor='rgba(245,169,75,0.55)';

function drawPiece(){
  pctx.clearRect(0,0,pcC.width,pcC.height);

  piecePath(pctx,P(pad),P(pad),P(s),P(r));
  pctx.clip();
  pctx.drawImage(off,P(tx-pad),P(ty-pad),P(s+2*pad),P(s+2*pad),0,0,P(s+2*pad),P(s+2*pad));

  piecePath(pctx,P(pad),P(pad),P(s),P(r));

function setX(x){
  curX=Math.max(8,Math.min(x,W-s-8));

  var trackW=track.clientWidth-handle.offsetWidth;
  var hl=Math.round(p*trackW);
  handle.style.left=hl+'px';

function tolerance(){return Math.max(4,Math.round(W*0.02));}

    bctx.drawImage(off,P(tx-pad),P(ty-pad),P(s+2*pad),P(s+2*pad),P(tx-pad),P(ty-pad),P(s+2*pad),P(s+2*pad));
    bgC.classList.add('flash');
    setTimeout(showOverlay,560);
  });
}
function failReset(){
  fails++;
  statusEl.textContent='没对准，再试一次';
  pcC.classList.add('shake');
  setTimeout(function(){pcC.classList.remove('shake');},400);
  animateTo(startX,220,function(){});
  if(fails>=3){
    hintEl.textContent='小提示：拖到画面里带金色光边的缺口处';
  }
}
function showOverlay(){
  revealImg.src=IMG_REVEAL||IMG_PUZZLE;
  overlay.classList.add('show');
  requestAnimationFrame(function(){overlay.classList.add('in');});
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){confetti();}
}
function restart(){
  overlay.classList.remove('in');
  setTimeout(function(){
    overlay.classList.remove('show');
    solved=false;fails=0;
    hintEl.textContent='';statusEl.textContent='';
    randomHole();drawBG();drawPiece();setX(startX);
  },200);
}
function confetti(){
  var c=confC,cx=c.getContext('2d');
  c.width=window.innerWidth;c.height=window.innerHeight;
  var colors=['#F5A94B','#F2EFE6','#7BC4A2','#E8654F','#FFFFFF'];
  var parts=[],i;
  for(i=0;i<130;i++){
    parts.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.4,
      w:6+Math.random()*6,h:8+Math.random()*8,
      vy:2.2+Math.random()*3,vx:-1.5+Math.random()*3,
      rot:Math.random()*Math.PI,vr:-0.15+Math.random()*0.3,
      col:colors[(Math.random()*colors.length)|0]});
  }
  var t0=performance.now();
  function loop(t){
    cx.clearRect(0,0,c.width,c.height);
    for(var j=0;j<parts.length;j++){
      var p=parts[j];p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
      cx.fillStyle=p.col;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      cx.restore();
    }
    if(t-t0<2800&&overlay.classList.contains('in')){requestAnimationFrame(loop);}
    else{cx.clearRect(0,0,c.width,c.height);}
  }
  requestAnimationFrame(loop);
}
handle.addEventListener('pointerdown',function(e){
  if(solved)return;
  dragging=true;
  try{handle.setPointerCapture(e.pointerId);}catch(err){}
});
handle.addEventListener('pointermove',function(e){
  if(!dragging)return;
  var rect=track.getBoundingClientRect();
  var hw=handle.offsetWidth;
  var px=e.clientX-rect.left-hw/2;
  px=Math.max(0,Math.min(px,rect.width-hw));
  var p=px/(rect.width-hw);
  setX(8+p*(W-s-16));
});
function endDrag(){
  if(!dragging)return;
  dragging=false;
  if(solved)return;
  if(Math.abs(curX-tx)<=tolerance()){snapSuccess();}else{failReset();}
}
handle.addEventListener('pointerup',endDrag);
handle.addEventListener('pointercancel',endDrag);
handle.addEventListener('keydown',function(e){
  if(solved)return;
  var step=e.shiftKey?0.08:0.02;
  var p=(curX-8)/(W-s-16);
  if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();setX(8+Math.max(0,p-step)*(W-s-16));}
  else if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();setX(8+Math.min(1,p+step)*(W-s-16));}
  else if(e.key==='Home'){e.preventDefault();setX(8);}
  else if(e.key==='End'){e.preventDefault();setX(W-s-8);}
  else if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    if(Math.abs(curX-tx)<=tolerance()){snapSuccess();}else{failReset();}
  }
});
$('#againBtn').addEventListener('click',restart);
var resizeTimer=null;
window.addEventListener('resize',function(){
  if(!img)return;
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(function(){
    var nw=window.innerWidth,nh=window.innerHeight;
    if(nw===lastLW&&Math.abs(nh-lastLH)<130)return;
    lastLW=nw;lastLH=nh;
    layout();randomHole();drawBG();drawPiece();setX(startX);
  },180);
});
loadImage(IMG_PUZZLE).then(function(i){
  img=i;
  lastLW=window.innerWidth;lastLH=window.innerHeight;
  layout();randomHole();drawBG();drawPiece();setX(startX);
}).catch(function(err){
  statusEl.textContent='图片加载失败，请刷新重试';
});
})();
</script>
</body>
</html>
